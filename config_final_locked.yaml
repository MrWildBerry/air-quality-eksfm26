weighted_svr:
  high_target_weights: [5]
rf:
  n_estimators: [300]
  max_depth: [null]
  min_samples_leaf: [2]
  max_features: [1.0]
svr:
  C: [10]
  epsilon: [0.05]
  gamma: [0.01]

